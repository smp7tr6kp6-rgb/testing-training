<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Morgan | Profile</title>
    <style>
        :root {
            color: #203040;
            background: #eef4f7;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
        }

        main {
            width: min(90%, 700px);
            margin: 48px auto;
        }

        .profile {
            padding: 40px;
            background: #ffffff;
            border: 1px solid #d5e1e8;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(32, 48, 64, 0.08);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .avatar {
            display: grid;
            width: 88px;
            height: 88px;
            place-items: center;
            color: #ffffff;
            background: #2c7a7b;
            border-radius: 50%;
            font-size: 2rem;
            font-weight: bold;
        }

        h1,
        h2,
        p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 6px;
        }

        .role {
            margin-bottom: 0;
            color: #5c7180;
        }

        section {
            margin-top: 28px;
        }

        h2 {
            font-size: 1.1rem;
            color: #2c7a7b;
        }

        ul {
            padding-left: 20px;
            line-height: 1.8;
        }

        a {
            color: #20639b;
        }

        @media (max-width: 480px) {
            .profile {
                padding: 28px 24px;
            }

            .profile-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <main>
        <article class="profile">
            <header class="profile-header">
                <div class="avatar" aria-hidden="true">AM</div>
                <div>
                    <h1>Alex Morgan</h1>
                    <p class="role">Frontend Developer</p>
                </div>
            </header>

            <section>
                <h2>About Me</h2>
                <p>I build simple, accessible websites and enjoy turning ideas into useful digital experiences.</p>
            </section>

            <section>
                <h2>Skills</h2>
                <ul>
                    <li>HTML and CSS</li>
                    <li>JavaScript</li>
                    <li>Responsive web design</li>
                </ul>
            </section>

            <section>
                <h2>Contact</h2>
                <p>Email: <a href="mailto:alex.morgan@example.com">alex.morgan@example.com</a></p>
            </section>
        </article>
    </main>
</body>
</html>
